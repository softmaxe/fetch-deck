[package]
name = "yt-dlp-tui"
version = "0.1.0"
edition = "2024"
description = "A friendly terminal interface for yt-dlp"
license = "MIT"
repository = "https://github.com/softmaxe/yt-dlp-tui"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
directories = "6.0.0"
libc = "0.2.189"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time", "signal"] }
toml = "1.1.4"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
